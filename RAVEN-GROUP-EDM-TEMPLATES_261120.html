<title>Raven Group EDM Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root{ --ink:#000; --paper:#fff; --muted:#6b6b6b; --page:#e9e9e9; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--page);color:var(--ink);min-height:100vh}
  a{color:inherit;text-decoration:none}

  .bar{background:#bb0f33;color:#fff;height:56px;display:flex;align-items:center;padding:0 16px;gap:16px}
  .bar .bar-logo{height:30px}
  .bar .tag{font-size:20px;letter-spacing:.08em;opacity:.8;text-transform:uppercase}

  header.hero{max-width:1320px;margin:0 auto;padding:56px 16px 32px}
  header.hero h1{font-size:clamp(30px,5vw,56px);font-weight:800;letter-spacing:-.01em;line-height:1}
  header.hero p{margin-top:14px;color:var(--muted);font-size:14px;max-width:60ch;line-height:1.5}

  main{max-width:1320px;margin:0 auto;padding:0 16px 64px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
  section.row{background:var(--paper);border:2px solid var(--brand);border-radius:2px;overflow:hidden}
  section.row.full{grid-column:1/-1}
  .row-head{background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
  .num{background:#fff;color:var(--brand);font:700 11px/1 "Inter",sans-serif;padding:4px 5px}
  .row-head h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

  .grid{display:grid;gap:14px;padding:14px}
  .grid.five{grid-template-columns:repeat(5,minmax(0,1fr))}

  .card{display:flex;flex-direction:column;border:2px solid var(--brand);border-radius:2px;overflow:hidden;background:var(--paper);transition:transform .12s ease, box-shadow .12s ease}
  .card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:4px 4px 0 var(--brand);outline:none}
  .thumb{background:var(--brand);color:#fff;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;padding:16px}
  .half .thumb{aspect-ratio:3/1}
  .logo{display:block;height:34%;max-width:80%;width:auto;object-fit:contain}
  .half svg.logo{height:32%}
  .half img.logo{height:44%}
  .grid.five .logo{height:40px}
  .meta{padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .meta strong{font-size:14px;letter-spacing:.02em;text-transform:uppercase}
  .meta .file{font:11px/1.4 "Inter",sans-serif;color:var(--muted);word-break:break-all}
  .meta .go{margin-top:auto;padding-top:10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .card:hover .go{text-decoration:underline}

  footer{max-width:1320px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:12px}

  @media (max-width:1100px){ .grid.five{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:720px){ main{grid-template-columns:1fr} .grid.five{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:440px){ .grid.five{grid-template-columns:1fr} }
</style>
</head>
